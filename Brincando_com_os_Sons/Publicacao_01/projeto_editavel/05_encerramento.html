
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
      <meta charset="UTF-8">
      <title>Card 05 - Encerramento</title>
      
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap');

      :root {
        --color-coral: #F47752;
        --color-coral-dark: #D45B38;
        --color-coral-light: #FEEAE4;
        --color-amarelo: #F5C85E;
        --color-amarelo-light: #FFF8E6;
        --color-verde-menta: #74BDB5;
        --color-verde-menta-light: #EBF7F5;
        --color-lilas: #A89BDD;
        --color-lilas-light: #F2EFFB;
        --color-creme: #FFF8F0;
        --color-azul-escuro: #24334B;
        --color-azul-medio: #3A4F6E;
        
        --font-title: 'Fredoka', cursive, sans-serif;
        --font-body: 'Nunito', sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }

      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background-color: var(--color-creme);
        font-family: var(--font-body);
        color: var(--color-azul-escuro);
      }

      .card-container {
        width: 1080px;
        height: 1350px;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 85px 80px 65px 80px;
        background-color: var(--color-creme);
        overflow: hidden;
      }

      /* Decorações de fundo com ondas e estrelas suaves */
      .bg-shapes {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      .card-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: space-between;
      }

      .footer-signature {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding-top: 15px;
      }

      .footer-signature .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background-color: var(--color-coral);
      }

      .footer-signature span {
        font-family: var(--font-title);
        font-size: 23px;
        font-weight: 600;
        letter-spacing: 4px;
        color: var(--color-azul-escuro);
        opacity: 0.75;
        text-transform: uppercase;
      }

      /* ================= CARD 01 - CAPA ================= */
      .card1-header {
        text-align: center;
        margin-top: 10px;
      }
      .badge-series {
        display: inline-block;
        background-color: var(--color-amarelo-light);
        border: 2px solid var(--color-amarelo);
        color: var(--color-azul-escuro);
        padding: 10px 28px;
        border-radius: 30px;
        font-family: var(--font-title);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 2px;
        margin-bottom: 30px;
        text-transform: uppercase;
      }
      .card1-title {
        font-family: var(--font-title);
        font-size: 68px;
        line-height: 1.18;
        font-weight: 700;
        color: var(--color-azul-escuro);
        margin-bottom: 20px;
        letter-spacing: -0.5px;
      }
      .card1-title .highlight-coral {
        color: var(--color-coral);
        display: block;
      }
      .card1-subtitle {
        font-family: var(--font-body);
        font-size: 38px;
        font-weight: 800;
        color: var(--color-verde-menta);
        letter-spacing: 0.5px;
      }

      .card1-grid-preview {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
        margin: 30px auto;
        width: 100%;
        max-width: 760px;
      }
      .card1-item {
        background: #FFFFFF;
        border-radius: 36px;
        height: 245px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 30px rgba(36, 51, 75, 0.05);
        padding: 22px;
        position: relative;
        border: 3px solid transparent;
      }
      .card1-item.pato { border-color: #FEE7B8; background: var(--color-amarelo-light); }
      .card1-item.panela { border-color: #C6EAE5; background: var(--color-verde-menta-light); }
      .card1-item.pipa { border-color: #DFDAF5; background: var(--color-lilas-light); }
      .card1-item.pao { border-color: #FDDCD2; background: var(--color-coral-light); }

      .card1-cta-pill {
        text-align: center;
        margin-top: 10px;
      }
      .card1-cta-pill span {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: var(--color-azul-escuro);
        color: var(--color-creme);
        padding: 14px 34px;
        border-radius: 40px;
        font-family: var(--font-title);
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      /* ================= CARD 02 - EXPLORAÇÃO VISUAL ================= */
      .card2-header {
        text-align: center;
      }
      .card2-title {
        font-family: var(--font-title);
        font-size: 66px;
        font-weight: 700;
        color: var(--color-coral);
        letter-spacing: -0.5px;
        margin-bottom: 12px;
      }
      .card2-instruction {
        font-family: var(--font-body);
        font-size: 34px;
        font-weight: 800;
        color: var(--color-azul-escuro);
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .card2-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 26px;
        margin: 28px 0;
      }
      .card2-box {
        border-radius: 36px;
        padding: 28px 20px 24px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        height: 385px;
        box-shadow: 0 10px 25px rgba(36, 51, 75, 0.04);
        border: 3.5px solid transparent;
      }
      .card2-box.box-pato {
        background-color: var(--color-amarelo-light);
        border-color: #F6CE70;
      }
      .card2-box.box-panela {
        background-color: var(--color-verde-menta-light);
        border-color: #8FD1C9;
      }
      .card2-box.box-pipa {
        background-color: var(--color-lilas-light);
        border-color: #BCB1E7;
      }
      .card2-box.box-pao {
        background-color: var(--color-coral-light);
        border-color: #F89B7E;
      }
      .card2-img-wrap {
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card2-label {
        font-family: var(--font-title);
        font-size: 52px;
        font-weight: 700;
        color: var(--color-azul-escuro);
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      /* ================= CARD 03 - DESCOBERTA DO SOM ================= */
      .card3-header {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .card3-icon-wrap {
        width: 100px;
        height: 100px;
        margin-bottom: 12px;
      }
      .card3-title {
        font-family: var(--font-title);
        font-size: 64px;
        font-weight: 700;
        color: var(--color-verde-menta);
        letter-spacing: -0.5px;
      }

      .card3-words-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin: 25px auto;
        width: 100%;
        max-width: 680px;
      }
      .card3-word-card {
        background: #FFFFFF;
        border-radius: 28px;
        padding: 16px 45px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 8px 24px rgba(36, 51, 75, 0.06);
        border: 2px solid #F0E8DC;
      }
      .card3-word-text {
        font-family: var(--font-title);
        font-size: 64px;
        font-weight: 700;
        letter-spacing: 6px;
      }
      .card3-word-text .p-letter {
        color: var(--color-coral);
        font-size: 78px;
        font-weight: 700;
        text-decoration: underline;
        text-decoration-color: var(--color-amarelo);
        text-underline-offset: 6px;
      }
      .card3-word-text .rest-letters {
        color: var(--color-azul-escuro);
      }
      .card3-mini-icon {
        width: 75px;
        height: 75px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card3-discovery-box {
        background: linear-gradient(135deg, var(--color-coral) 0%, #E8643D 100%);
        border-radius: 34px;
        padding: 32px 30px;
        text-align: center;
        color: #FFFFFF;
        box-shadow: 0 16px 36px rgba(244, 119, 82, 0.28);
      }
      .card3-discovery-box h3 {
        font-family: var(--font-title);
        font-size: 46px;
        font-weight: 700;
        letter-spacing: 1px;
        line-height: 1.25;
      }
      .card3-discovery-box p {
        font-family: var(--font-body);
        font-size: 26px;
        font-weight: 700;
        margin-top: 8px;
        opacity: 0.95;
      }

      /* ================= CARD 04 - DESAFIO INTERATIVO ================= */
      .card4-header {
        text-align: center;
      }
      .card4-title {
        font-family: var(--font-title);
        font-size: 68px;
        font-weight: 700;
        color: var(--color-lilas);
        letter-spacing: -0.5px;
        margin-bottom: 15px;
      }
      .card4-question {
        font-family: var(--font-title);
        font-size: 52px;
        font-weight: 700;
        color: var(--color-azul-escuro);
        line-height: 1.25;
        max-width: 820px;
        margin: 0 auto;
      }
      .card4-question .highlight {
        color: var(--color-coral);
      }

      .card4-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 25px 0;
      }
      .card4-interrogacao-wrap {
        width: 270px;
        height: 290px;
      }

      .card4-hints-container {
        width: 100%;
        max-width: 860px;
        margin: 0 auto;
      }
      .card4-hints-label {
        text-align: center;
        font-family: var(--font-body);
        font-size: 29px;
        font-weight: 800;
        color: var(--color-azul-medio);
        letter-spacing: 1px;
        margin-bottom: 22px;
        text-transform: uppercase;
      }
      .card4-hints-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 22px;
      }
      .card4-hint-card {
        background: #FFFFFF;
        border-radius: 28px;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        box-shadow: 0 10px 24px rgba(36, 51, 75, 0.05);
        border: 2.5px solid #F1EAE0;
      }
      .card4-hint-icon {
        width: 85px;
        height: 85px;
        margin-bottom: 12px;
      }
      .card4-hint-card span {
        font-family: var(--font-title);
        font-size: 26px;
        font-weight: 600;
        color: var(--color-azul-escuro);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* ================= CARD 05 - ENCERRAMENTO E CTA ================= */
      .card5-container {
        background-color: var(--color-verde-menta-light);
      }
      .card5-header {
        text-align: center;
        margin-top: 10px;
      }
      .card5-title-box {
        background: #FFFFFF;
        border: 3px solid var(--color-verde-menta);
        border-radius: 32px;
        padding: 30px 36px;
        box-shadow: 0 10px 28px rgba(116, 189, 181, 0.15);
      }
      .card5-title {
        font-family: var(--font-title);
        font-size: 44px;
        line-height: 1.28;
        font-weight: 700;
        color: var(--color-azul-escuro);
      }

      .card5-illustration-wrap {
        width: 340px;
        height: 230px;
        margin: 25px auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card5-cta-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        margin: 15px 0;
      }
      .card5-question {
        font-family: var(--font-title);
        font-size: 48px;
        font-weight: 700;
        color: var(--color-azul-escuro);
        text-align: center;
        line-height: 1.25;
      }
      .card5-question .highlight {
        color: var(--color-coral);
        padding: 0 6px;
      }

      .card5-button-comments {
        background: var(--color-coral);
        color: #FFFFFF;
        width: 100%;
        max-width: 660px;
        padding: 24px 30px;
        border-radius: 40px;
        text-align: center;
        font-family: var(--font-title);
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 2px;
        box-shadow: 0 14px 32px rgba(244, 119, 82, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .card5-save-pill {
        background: #FFFFFF;
        border: 2px dashed var(--color-azul-medio);
        color: var(--color-azul-escuro);
        padding: 14px 34px;
        border-radius: 30px;
        font-family: var(--font-body);
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 1px;
      }
    </style>
  
    </head>
    <body>
      <div class="card-container card5-container">
        <svg class="bg-shapes" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
          <circle cx="950" cy="200" r="170" fill="#74BDB5" opacity="0.2" />
          <circle cx="100" cy="850" r="180" fill="#F47752" opacity="0.1" />
          <circle cx="920" cy="1150" r="150" fill="#F5C85E" opacity="0.15" />
        </svg>

        <div class="card-content">
          <div class="card5-header">
            <div class="card5-title-box">
              <h1 class="card5-title">
                BRINCAR COM OS SONS É CRIAR OPORTUNIDADES DE COMUNICAÇÃO!
              </h1>
            </div>
          </div>

          <div class="card5-illustration-wrap">
            
    <svg viewBox="0 0 280 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <!-- Balão 1 (Lilás - trás) -->
      <path d="M 50 40 C 50 20 170 20 170 50 C 170 80 120 85 90 85 L 65 100 L 72 85 C 55 85 50 65 50 40 Z" fill="#A89BDD" opacity="0.85" />
      <!-- Balão 2 (Coral - frente) -->
      <path d="M 110 80 C 110 55 240 55 240 90 C 240 120 195 125 170 125 L 155 145 L 158 125 C 120 125 110 105 110 80 Z" fill="#F47752" />
      <circle cx="150" cy="90" r="5" fill="#FFF8F0" />
      <circle cx="175" cy="90" r="5" fill="#FFF8F0" />
      <circle cx="200" cy="90" r="5" fill="#FFF8F0" />
      <!-- Coraçãozinho de conexão afetuosa -->
      <path d="M 235 38 C 235 32 242 28 248 33 C 254 28 261 32 261 38 C 261 48 248 54 248 54 C 248 54 235 48 235 38 Z" fill="#F5C85E" />
    </svg>
  
          </div>

          <div class="card5-cta-section">
            <h2 class="card5-question">
              QUAL PALAVRA COM <span class="highlight">/P/</span> VOCÊ LEMBROU?
            </h2>

            <div class="card5-button-comments">
              <span>CONTE NOS COMENTÁRIOS!</span>
              <span>💬</span>
            </div>

            <div class="card5-save-pill">
              SALVE PARA BRINCAR DEPOIS. 🔖
            </div>
          </div>

          <div class="footer-signature">
            <div class="dot"></div>
            <span>BRINCANDO COM OS SONS</span>
            <div class="dot"></div>
          </div>
        </div>
      </div>
    </body>
    </html>


    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
      <meta charset="UTF-8">
      <title>Card 03 - Descoberta</title>
      
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap');

      :root {
        --color-coral: #F47752;
        --color-coral-dark: #D45B38;
        --color-coral-light: #FEEAE4;
        --color-amarelo: #F5C85E;
        --color-amarelo-light: #FFF8E6;
        --color-verde-menta: #74BDB5;
        --color-verde-menta-light: #EBF7F5;
        --color-lilas: #A89BDD;
        --color-lilas-light: #F2EFFB;
        --color-creme: #FFF8F0;
        --color-azul-escuro: #24334B;
        --color-azul-medio: #3A4F6E;
        
        --font-title: 'Fredoka', cursive, sans-serif;
        --font-body: 'Nunito', sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }

      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background-color: var(--color-creme);
        font-family: var(--font-body);
        color: var(--color-azul-escuro);
      }

      .card-container {
        width: 1080px;
        height: 1350px;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 85px 80px 65px 80px;
        background-color: var(--color-creme);
        overflow: hidden;
      }

      /* Decorações de fundo com ondas e estrelas suaves */
      .bg-shapes {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      .card-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: space-between;
      }

      .footer-signature {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding-top: 15px;
      }

      .footer-signature .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background-color: var(--color-coral);
      }

      .footer-signature span {
        font-family: var(--font-title);
        font-size: 23px;
        font-weight: 600;
        letter-spacing: 4px;
        color: var(--color-azul-escuro);
        opacity: 0.75;
        text-transform: uppercase;
      }

      /* ================= CARD 01 - CAPA ================= */
      .card1-header {
        text-align: center;
        margin-top: 10px;
      }
      .badge-series {
        display: inline-block;
        background-color: var(--color-amarelo-light);
        border: 2px solid var(--color-amarelo);
        color: var(--color-azul-escuro);
        padding: 10px 28px;
        border-radius: 30px;
        font-family: var(--font-title);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 2px;
        margin-bottom: 30px;
        text-transform: uppercase;
      }
      .card1-title {
        font-family: var(--font-title);
        font-size: 68px;
        line-height: 1.18;
        font-weight: 700;
        color: var(--color-azul-escuro);
        margin-bottom: 20px;
        letter-spacing: -0.5px;
      }
      .card1-title .highlight-coral {
        color: var(--color-coral);
        display: block;
      }
      .card1-subtitle {
        font-family: var(--font-body);
        font-size: 38px;
        font-weight: 800;
        color: var(--color-verde-menta);
        letter-spacing: 0.5px;
      }

      .card1-grid-preview {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
        margin: 30px auto;
        width: 100%;
        max-width: 760px;
      }
      .card1-item {
        background: #FFFFFF;
        border-radius: 36px;
        height: 245px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 30px rgba(36, 51, 75, 0.05);
        padding: 22px;
        position: relative;
        border: 3px solid transparent;
      }
      .card1-item.pato { border-color: #FEE7B8; background: var(--color-amarelo-light); }
      .card1-item.panela { border-color: #C6EAE5; background: var(--color-verde-menta-light); }
      .card1-item.pipa { border-color: #DFDAF5; background: var(--color-lilas-light); }
      .card1-item.pao { border-color: #FDDCD2; background: var(--color-coral-light); }

      .card1-cta-pill {
        text-align: center;
        margin-top: 10px;
      }
      .card1-cta-pill span {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: var(--color-azul-escuro);
        color: var(--color-creme);
        padding: 14px 34px;
        border-radius: 40px;
        font-family: var(--font-title);
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      /* ================= CARD 02 - EXPLORAÇÃO VISUAL ================= */
      .card2-header {
        text-align: center;
      }
      .card2-title {
        font-family: var(--font-title);
        font-size: 66px;
        font-weight: 700;
        color: var(--color-coral);
        letter-spacing: -0.5px;
        margin-bottom: 12px;
      }
      .card2-instruction {
        font-family: var(--font-body);
        font-size: 34px;
        font-weight: 800;
        color: var(--color-azul-escuro);
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .card2-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 26px;
        margin: 28px 0;
      }
      .card2-box {
        border-radius: 36px;
        padding: 28px 20px 24px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        height: 385px;
        box-shadow: 0 10px 25px rgba(36, 51, 75, 0.04);
        border: 3.5px solid transparent;
      }
      .card2-box.box-pato {
        background-color: var(--color-amarelo-light);
        border-color: #F6CE70;
      }
      .card2-box.box-panela {
        background-color: var(--color-verde-menta-light);
        border-color: #8FD1C9;
      }
      .card2-box.box-pipa {
        background-color: var(--color-lilas-light);
        border-color: #BCB1E7;
      }
      .card2-box.box-pao {
        background-color: var(--color-coral-light);
        border-color: #F89B7E;
      }
      .card2-img-wrap {
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card2-label {
        font-family: var(--font-title);
        font-size: 52px;
        font-weight: 700;
        color: var(--color-azul-escuro);
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      /* ================= CARD 03 - DESCOBERTA DO SOM ================= */
      .card3-header {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .card3-icon-wrap {
        width: 100px;
        height: 100px;
        margin-bottom: 12px;
      }
      .card3-title {
        font-family: var(--font-title);
        font-size: 64px;
        font-weight: 700;
        color: var(--color-verde-menta);
        letter-spacing: -0.5px;
      }

      .card3-words-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin: 25px auto;
        width: 100%;
        max-width: 680px;
      }
      .card3-word-card {
        background: #FFFFFF;
        border-radius: 28px;
        padding: 16px 45px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 8px 24px rgba(36, 51, 75, 0.06);
        border: 2px solid #F0E8DC;
      }
      .card3-word-text {
        font-family: var(--font-title);
        font-size: 64px;
        font-weight: 700;
        letter-spacing: 6px;
      }
      .card3-word-text .p-letter {
        color: var(--color-coral);
        font-size: 78px;
        font-weight: 700;
        text-decoration: underline;
        text-decoration-color: var(--color-amarelo);
        text-underline-offset: 6px;
      }
      .card3-word-text .rest-letters {
        color: var(--color-azul-escuro);
      }
      .card3-mini-icon {
        width: 75px;
        height: 75px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card3-discovery-box {
        background: linear-gradient(135deg, var(--color-coral) 0%, #E8643D 100%);
        border-radius: 34px;
        padding: 32px 30px;
        text-align: center;
        color: #FFFFFF;
        box-shadow: 0 16px 36px rgba(244, 119, 82, 0.28);
      }
      .card3-discovery-box h3 {
        font-family: var(--font-title);
        font-size: 46px;
        font-weight: 700;
        letter-spacing: 1px;
        line-height: 1.25;
      }
      .card3-discovery-box p {
        font-family: var(--font-body);
        font-size: 26px;
        font-weight: 700;
        margin-top: 8px;
        opacity: 0.95;
      }

      /* ================= CARD 04 - DESAFIO INTERATIVO ================= */
      .card4-header {
        text-align: center;
      }
      .card4-title {
        font-family: var(--font-title);
        font-size: 68px;
        font-weight: 700;
        color: var(--color-lilas);
        letter-spacing: -0.5px;
        margin-bottom: 15px;
      }
      .card4-question {
        font-family: var(--font-title);
        font-size: 52px;
        font-weight: 700;
        color: var(--color-azul-escuro);
        line-height: 1.25;
        max-width: 820px;
        margin: 0 auto;
      }
      .card4-question .highlight {
        color: var(--color-coral);
      }

      .card4-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 25px 0;
      }
      .card4-interrogacao-wrap {
        width: 270px;
        height: 290px;
      }

      .card4-hints-container {
        width: 100%;
        max-width: 860px;
        margin: 0 auto;
      }
      .card4-hints-label {
        text-align: center;
        font-family: var(--font-body);
        font-size: 29px;
        font-weight: 800;
        color: var(--color-azul-medio);
        letter-spacing: 1px;
        margin-bottom: 22px;
        text-transform: uppercase;
      }
      .card4-hints-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 22px;
      }
      .card4-hint-card {
        background: #FFFFFF;
        border-radius: 28px;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        box-shadow: 0 10px 24px rgba(36, 51, 75, 0.05);
        border: 2.5px solid #F1EAE0;
      }
      .card4-hint-icon {
        width: 85px;
        height: 85px;
        margin-bottom: 12px;
      }
      .card4-hint-card span {
        font-family: var(--font-title);
        font-size: 26px;
        font-weight: 600;
        color: var(--color-azul-escuro);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* ================= CARD 05 - ENCERRAMENTO E CTA ================= */
      .card5-container {
        background-color: var(--color-verde-menta-light);
      }
      .card5-header {
        text-align: center;
        margin-top: 10px;
      }
      .card5-title-box {
        background: #FFFFFF;
        border: 3px solid var(--color-verde-menta);
        border-radius: 32px;
        padding: 30px 36px;
        box-shadow: 0 10px 28px rgba(116, 189, 181, 0.15);
      }
      .card5-title {
        font-family: var(--font-title);
        font-size: 44px;
        line-height: 1.28;
        font-weight: 700;
        color: var(--color-azul-escuro);
      }

      .card5-illustration-wrap {
        width: 340px;
        height: 230px;
        margin: 25px auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card5-cta-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        margin: 15px 0;
      }
      .card5-question {
        font-family: var(--font-title);
        font-size: 48px;
        font-weight: 700;
        color: var(--color-azul-escuro);
        text-align: center;
        line-height: 1.25;
      }
      .card5-question .highlight {
        color: var(--color-coral);
        padding: 0 6px;
      }

      .card5-button-comments {
        background: var(--color-coral);
        color: #FFFFFF;
        width: 100%;
        max-width: 660px;
        padding: 24px 30px;
        border-radius: 40px;
        text-align: center;
        font-family: var(--font-title);
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 2px;
        box-shadow: 0 14px 32px rgba(244, 119, 82, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .card5-save-pill {
        background: #FFFFFF;
        border: 2px dashed var(--color-azul-medio);
        color: var(--color-azul-escuro);
        padding: 14px 34px;
        border-radius: 30px;
        font-family: var(--font-body);
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 1px;
      }
    </style>
  
    </head>
    <body>
      <div class="card-container">
        <svg class="bg-shapes" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
          <circle cx="920" cy="220" r="150" fill="#74BDB5" opacity="0.12" />
          <circle cx="140" cy="980" r="170" fill="#F47752" opacity="0.08" />
        </svg>

        <div class="card-content">
          <div class="card3-header">
            <div class="card3-icon-wrap">
              
    <svg viewBox="0 0 160 160" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <!-- Orelhinha / Fone lúdico de escuta com ondas sonoras -->
      <rect x="25" y="48" width="24" height="64" rx="12" fill="#74BDB5" />
      <rect x="111" y="48" width="24" height="64" rx="12" fill="#74BDB5" />
      <path d="M 37 54 C 37 18 123 18 123 54" fill="none" stroke="#24334B" stroke-width="7" stroke-linecap="round" />
      <!-- Ondas sonoras de escuta suave -->
      <path d="M 143 65 C 151 74 151 86 143 95" fill="none" stroke="#F47752" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 152 56 C 165 70 165 90 152 104" fill="none" stroke="#F5C85E" stroke-width="4.5" stroke-linecap="round" />
    </svg>
  
            </div>
            <h1 class="card3-title">ESCUTE O COMEÇO!</h1>
          </div>

          <div class="card3-words-list">
            <div class="card3-word-card">
              <div class="card3-word-text">
                <span class="p-letter">P</span><span class="rest-letters">ATO</span>
              </div>
              <div class="card3-mini-icon">
    <svg viewBox="0 0 240 240" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gradPatoCorpo" cx="45%" cy="40%" r="55%">
          <stop offset="0%" stop-color="#FFF0A5" />
          <stop offset="65%" stop-color="#F5C85E" />
          <stop offset="100%" stop-color="#EAA638" />
        </radialGradient>
        <radialGradient id="gradPatoBico" cx="30%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#FF9B71" />
          <stop offset="100%" stop-color="#F47752" />
        </radialGradient>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>
      <!-- Ondas suaves da água -->
      <path d="M 20 190 Q 60 178 100 190 T 180 190 T 220 190" fill="none" stroke="#74BDB5" stroke-width="6" stroke-linecap="round" opacity="0.75" />
      <path d="M 45 205 Q 85 195 125 205 T 195 205" fill="none" stroke="#74BDB5" stroke-width="4.5" stroke-linecap="round" opacity="0.5" />
      
      <!-- Cauda e Corpo -->
      <path d="M 60 145 C 35 125 45 105 70 125 C 80 115 105 105 145 110 C 180 115 200 140 195 165 C 190 190 150 195 110 192 C 75 190 55 170 60 145 Z" 
            fill="url(#gradPatoCorpo)" />
      
      <!-- Asa com textura em camadas -->
      <path d="M 85 145 C 95 125 125 125 150 138 C 160 143 162 160 145 168 C 120 176 95 170 85 145 Z" 
            fill="#EAA638" opacity="0.6" />
      <path d="M 95 145 C 105 130 128 132 145 142 C 150 146 148 158 138 162 C 118 168 100 160 95 145 Z" 
            fill="#F5C85E" />

      <!-- Pescoço e Cabeça -->
      <circle cx="155" cy="85" r="38" fill="url(#gradPatoCorpo)" />
      
      <!-- Bochecha corada sutil -->
      <circle cx="145" cy="96" r="10" fill="#F47752" opacity="0.25" />

      <!-- Bico amigável e arredondado -->
      <path d="M 180 82 C 195 80 215 85 212 94 C 210 102 190 102 178 96 Z" 
            fill="url(#gradPatoBico)" />

      <!-- Olhinho fofo com brilho -->
      <circle cx="162" cy="78" r="6.5" fill="#24334B" />
      <circle cx="160.5" cy="76" r="2.2" fill="#FFFFFF" />
      
      <!-- Peninha no topo da cabeça -->
      <path d="M 152 48 C 156 38 165 42 160 52 Z" fill="#EAA638" />
    </svg>
  </div>
            </div>

            <div class="card3-word-card">
              <div class="card3-word-text">
                <span class="p-letter">P</span><span class="rest-letters">ANELA</span>
              </div>
              <div class="card3-mini-icon">
    <svg viewBox="0 0 240 240" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gradPanela" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#9AD3CD" />
          <stop offset="50%" stop-color="#74BDB5" />
          <stop offset="100%" stop-color="#529C94" />
        </linearGradient>
        <linearGradient id="gradTampa" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFF8F0" />
          <stop offset="100%" stop-color="#D9EFEA" />
        </linearGradient>
      </defs>
      <!-- Vapores lúdicos -->
      <path d="M 105 50 Q 115 35 105 20" fill="none" stroke="#74BDB5" stroke-width="4" stroke-linecap="round" opacity="0.6" />
      <path d="M 125 45 Q 135 25 125 10" fill="none" stroke="#F5C85E" stroke-width="4.5" stroke-linecap="round" opacity="0.7" />
      <path d="M 145 52 Q 155 38 148 24" fill="none" stroke="#A89BDD" stroke-width="4" stroke-linecap="round" opacity="0.6" />

      <!-- Alça Esquerda -->
      <path d="M 46 125 C 24 125 24 155 46 155" fill="none" stroke="#24334B" stroke-width="7" stroke-linecap="round" />
      <!-- Alça Direita -->
      <path d="M 194 125 C 216 125 216 155 194 155" fill="none" stroke="#24334B" stroke-width="7" stroke-linecap="round" />

      <!-- Corpo da Panela -->
      <rect x="44" y="110" width="152" height="78" rx="28" fill="url(#gradPanela)" />
      <!-- Brilho frontal suave -->
      <path d="M 64 122 C 72 155 72 165 64 175" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.4" />

      <!-- Tampa da Panela -->
      <ellipse cx="120" cy="110" rx="76" ry="14" fill="#529C94" />
      <path d="M 48 108 C 55 82 185 82 192 108 Z" fill="url(#gradTampa)" stroke="#74BDB5" stroke-width="3" />
      
      <!-- Pegador da tampa -->
      <rect x="110" y="68" width="20" height="15" rx="6" fill="#F47752" />
      <ellipse cx="120" cy="68" rx="15" ry="6" fill="#FF9B71" />
    </svg>
  </div>
            </div>

            <div class="card3-word-card">
              <div class="card3-word-text">
                <span class="p-letter">P</span><span class="rest-letters">IPA</span>
              </div>
              <div class="card3-mini-icon">
    <svg viewBox="0 0 240 240" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gradPipaLinha" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#24334B" />
          <stop offset="100%" stop-color="#A89BDD" />
        </linearGradient>
      </defs>
      <!-- Rabiola ondulada com movimento -->
      <path d="M 120 165 C 100 185 70 195 90 220 C 98 230 115 225 125 235" 
            fill="none" stroke="#24334B" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 1" />
      
      <!-- Lacinhos da rabiola -->
      <!-- Laço 1 (Coral) -->
      <path d="M 100 182 L 86 177 L 102 190 L 88 195 Z" fill="#F47752" />
      <!-- Laço 2 (Amarelo) -->
      <path d="M 76 206 L 68 198 L 82 216 L 68 218 Z" fill="#F5C85E" />
      <!-- Laço 3 (Lilás) -->
      <path d="M 108 226 L 118 218 L 106 236 L 122 235 Z" fill="#A89BDD" />

      <!-- Corpo da Pipa - 4 Quadrantes -->
      <!-- Quadrante Superior Esquerdo (Coral) -->
      <polygon points="120,35 60,105 120,105" fill="#F47752" opacity="0.9" />
      <!-- Quadrante Superior Direito (Amarelo) -->
      <polygon points="120,35 180,105 120,105" fill="#F5C85E" opacity="0.95" />
      <!-- Quadrante Inferior Esquerdo (Verde Menta) -->
      <polygon points="60,105 120,168 120,105" fill="#74BDB5" opacity="0.9" />
      <!-- Quadrante Inferior Direito (Lilás) -->
      <polygon points="180,105 120,168 120,105" fill="#A89BDD" opacity="0.9" />

      <!-- Varetas da pipa (Estrutura) -->
      <line x1="120" y1="35" x2="120" y2="168" stroke="#FFF8F0" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 60 105 Q 120 118 180 105" fill="none" stroke="#FFF8F0" stroke-width="4" stroke-linecap="round" />

      <!-- Contorno suave elegante -->
      <polygon points="120,35 180,105 120,168 60,105" fill="none" stroke="#24334B" stroke-width="4" stroke-linejoin="round" />
    </svg>
  </div>
            </div>

            <div class="card3-word-card">
              <div class="card3-word-text">
                <span class="p-letter">P</span><span class="rest-letters">ÃO</span>

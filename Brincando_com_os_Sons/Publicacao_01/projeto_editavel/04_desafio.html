
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
      <meta charset="UTF-8">
      <title>Card 04 - Desafio</title>
      
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap');

      :root {
        --color-coral: #F47752;
        --color-coral-dark: #D45B38;
        --color-coral-light: #FEEAE4;
        --color-amarelo: #F5C85E;
        --color-amarelo-light: #FFF8E6;
        --color-verde-menta: #74BDB5;
        --color-verde-menta-light: #EBF7F5;
        --color-lilas: #A89BDD;
        --color-lilas-light: #F2EFFB;
        --color-creme: #FFF8F0;
        --color-azul-escuro: #24334B;
        --color-azul-medio: #3A4F6E;
        
        --font-title: 'Fredoka', cursive, sans-serif;
        --font-body: 'Nunito', sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }

      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background-color: var(--color-creme);
        font-family: var(--font-body);
        color: var(--color-azul-escuro);
      }

      .card-container {
        width: 1080px;
        height: 1350px;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 85px 80px 65px 80px;
        background-color: var(--color-creme);
        overflow: hidden;
      }

      /* Decorações de fundo com ondas e estrelas suaves */
      .bg-shapes {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      .card-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: space-between;
      }

      .footer-signature {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding-top: 15px;
      }

      .footer-signature .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background-color: var(--color-coral);
      }

      .footer-signature span {
        font-family: var(--font-title);
        font-size: 23px;
        font-weight: 600;
        letter-spacing: 4px;
        color: var(--color-azul-escuro);
        opacity: 0.75;
        text-transform: uppercase;
      }

      /* ================= CARD 01 - CAPA ================= */
      .card1-header {
        text-align: center;
        margin-top: 10px;
      }
      .badge-series {
        display: inline-block;
        background-color: var(--color-amarelo-light);
        border: 2px solid var(--color-amarelo);
        color: var(--color-azul-escuro);
        padding: 10px 28px;
        border-radius: 30px;
        font-family: var(--font-title);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 2px;
        margin-bottom: 30px;
        text-transform: uppercase;
      }
      .card1-title {
        font-family: var(--font-title);
        font-size: 68px;
        line-height: 1.18;
        font-weight: 700;
        color: var(--color-azul-escuro);
        margin-bottom: 20px;
        letter-spacing: -0.5px;
      }
      .card1-title .highlight-coral {
        color: var(--color-coral);
        display: block;
      }
      .card1-subtitle {
        font-family: var(--font-body);
        font-size: 38px;
        font-weight: 800;
        color: var(--color-verde-menta);
        letter-spacing: 0.5px;
      }

      .card1-grid-preview {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
        margin: 30px auto;
        width: 100%;
        max-width: 760px;
      }
      .card1-item {
        background: #FFFFFF;
        border-radius: 36px;
        height: 245px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 30px rgba(36, 51, 75, 0.05);
        padding: 22px;
        position: relative;
        border: 3px solid transparent;
      }
      .card1-item.pato { border-color: #FEE7B8; background: var(--color-amarelo-light); }
      .card1-item.panela { border-color: #C6EAE5; background: var(--color-verde-menta-light); }
      .card1-item.pipa { border-color: #DFDAF5; background: var(--color-lilas-light); }
      .card1-item.pao { border-color: #FDDCD2; background: var(--color-coral-light); }

      .card1-cta-pill {
        text-align: center;
        margin-top: 10px;
      }
      .card1-cta-pill span {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: var(--color-azul-escuro);
        color: var(--color-creme);
        padding: 14px 34px;
        border-radius: 40px;
        font-family: var(--font-title);
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      /* ================= CARD 02 - EXPLORAÇÃO VISUAL ================= */
      .card2-header {
        text-align: center;
      }
      .card2-title {
        font-family: var(--font-title);
        font-size: 66px;
        font-weight: 700;
        color: var(--color-coral);
        letter-spacing: -0.5px;
        margin-bottom: 12px;
      }
      .card2-instruction {
        font-family: var(--font-body);
        font-size: 34px;
        font-weight: 800;
        color: var(--color-azul-escuro);
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .card2-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 26px;
        margin: 28px 0;
      }
      .card2-box {
        border-radius: 36px;
        padding: 28px 20px 24px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        height: 385px;
        box-shadow: 0 10px 25px rgba(36, 51, 75, 0.04);
        border: 3.5px solid transparent;
      }
      .card2-box.box-pato {
        background-color: var(--color-amarelo-light);
        border-color: #F6CE70;
      }
      .card2-box.box-panela {
        background-color: var(--color-verde-menta-light);
        border-color: #8FD1C9;
      }
      .card2-box.box-pipa {
        background-color: var(--color-lilas-light);
        border-color: #BCB1E7;
      }
      .card2-box.box-pao {
        background-color: var(--color-coral-light);
        border-color: #F89B7E;
      }
      .card2-img-wrap {
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card2-label {
        font-family: var(--font-title);
        font-size: 52px;
        font-weight: 700;
        color: var(--color-azul-escuro);
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      /* ================= CARD 03 - DESCOBERTA DO SOM ================= */
      .card3-header {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .card3-icon-wrap {
        width: 100px;
        height: 100px;
        margin-bottom: 12px;
      }
      .card3-title {
        font-family: var(--font-title);
        font-size: 64px;
        font-weight: 700;
        color: var(--color-verde-menta);
        letter-spacing: -0.5px;
      }

      .card3-words-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin: 25px auto;
        width: 100%;
        max-width: 680px;
      }
      .card3-word-card {
        background: #FFFFFF;
        border-radius: 28px;
        padding: 16px 45px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 8px 24px rgba(36, 51, 75, 0.06);
        border: 2px solid #F0E8DC;
      }
      .card3-word-text {
        font-family: var(--font-title);
        font-size: 64px;
        font-weight: 700;
        letter-spacing: 6px;
      }
      .card3-word-text .p-letter {
        color: var(--color-coral);
        font-size: 78px;
        font-weight: 700;
        text-decoration: underline;
        text-decoration-color: var(--color-amarelo);
        text-underline-offset: 6px;
      }
      .card3-word-text .rest-letters {
        color: var(--color-azul-escuro);
      }
      .card3-mini-icon {
        width: 75px;
        height: 75px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card3-discovery-box {
        background: linear-gradient(135deg, var(--color-coral) 0%, #E8643D 100%);
        border-radius: 34px;
        padding: 32px 30px;
        text-align: center;
        color: #FFFFFF;
        box-shadow: 0 16px 36px rgba(244, 119, 82, 0.28);
      }
      .card3-discovery-box h3 {
        font-family: var(--font-title);
        font-size: 46px;
        font-weight: 700;
        letter-spacing: 1px;
        line-height: 1.25;
      }
      .card3-discovery-box p {
        font-family: var(--font-body);
        font-size: 26px;
        font-weight: 700;
        margin-top: 8px;
        opacity: 0.95;
      }

      /* ================= CARD 04 - DESAFIO INTERATIVO ================= */
      .card4-header {
        text-align: center;
      }
      .card4-title {
        font-family: var(--font-title);
        font-size: 68px;
        font-weight: 700;
        color: var(--color-lilas);
        letter-spacing: -0.5px;
        margin-bottom: 15px;
      }
      .card4-question {
        font-family: var(--font-title);
        font-size: 52px;
        font-weight: 700;
        color: var(--color-azul-escuro);
        line-height: 1.25;
        max-width: 820px;
        margin: 0 auto;
      }
      .card4-question .highlight {
        color: var(--color-coral);
      }

      .card4-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 25px 0;
      }
      .card4-interrogacao-wrap {
        width: 270px;
        height: 290px;
      }

      .card4-hints-container {
        width: 100%;
        max-width: 860px;
        margin: 0 auto;
      }
      .card4-hints-label {
        text-align: center;
        font-family: var(--font-body);
        font-size: 29px;
        font-weight: 800;
        color: var(--color-azul-medio);
        letter-spacing: 1px;
        margin-bottom: 22px;
        text-transform: uppercase;
      }
      .card4-hints-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 22px;
      }
      .card4-hint-card {
        background: #FFFFFF;
        border-radius: 28px;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        box-shadow: 0 10px 24px rgba(36, 51, 75, 0.05);
        border: 2.5px solid #F1EAE0;
      }
      .card4-hint-icon {
        width: 85px;
        height: 85px;
        margin-bottom: 12px;
      }
      .card4-hint-card span {
        font-family: var(--font-title);
        font-size: 26px;
        font-weight: 600;
        color: var(--color-azul-escuro);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* ================= CARD 05 - ENCERRAMENTO E CTA ================= */
      .card5-container {
        background-color: var(--color-verde-menta-light);
      }
      .card5-header {
        text-align: center;
        margin-top: 10px;
      }
      .card5-title-box {
        background: #FFFFFF;
        border: 3px solid var(--color-verde-menta);
        border-radius: 32px;
        padding: 30px 36px;
        box-shadow: 0 10px 28px rgba(116, 189, 181, 0.15);
      }
      .card5-title {
        font-family: var(--font-title);
        font-size: 44px;
        line-height: 1.28;
        font-weight: 700;
        color: var(--color-azul-escuro);
      }

      .card5-illustration-wrap {
        width: 340px;
        height: 230px;
        margin: 25px auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card5-cta-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        margin: 15px 0;
      }
      .card5-question {
        font-family: var(--font-title);
        font-size: 48px;
        font-weight: 700;
        color: var(--color-azul-escuro);
        text-align: center;
        line-height: 1.25;
      }
      .card5-question .highlight {
        color: var(--color-coral);
        padding: 0 6px;
      }

      .card5-button-comments {
        background: var(--color-coral);
        color: #FFFFFF;
        width: 100%;
        max-width: 660px;
        padding: 24px 30px;
        border-radius: 40px;
        text-align: center;
        font-family: var(--font-title);
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 2px;
        box-shadow: 0 14px 32px rgba(244, 119, 82, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .card5-save-pill {
        background: #FFFFFF;
        border: 2px dashed var(--color-azul-medio);
        color: var(--color-azul-escuro);
        padding: 14px 34px;
        border-radius: 30px;
        font-family: var(--font-body);
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 1px;
      }
    </style>
  
    </head>
    <body>
      <div class="card-container">
        <svg class="bg-shapes" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
          <circle cx="880" cy="180" r="150" fill="#A89BDD" opacity="0.12" />
          <circle cx="150" cy="650" r="160" fill="#F5C85E" opacity="0.12" />
        </svg>

        <div class="card-content">
          <div class="card4-header">
            <h1 class="card4-title">AGORA É SUA VEZ!</h1>
            <p class="card4-question">
              QUE OUTRA PALAVRA COMEÇA COM O <span class="highlight">SOM /P/</span>?
            </p>
          </div>

          <div class="card4-center">
            <div class="card4-interrogacao-wrap">
              
    <svg viewBox="0 0 240 260" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gradDotCoral" cx="30%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#FF9B71" />
          <stop offset="100%" stop-color="#F47752" />
        </radialGradient>
      </defs>
      <!-- Elementos coloridos formando o arco da interrogação -->
      <circle cx="85" cy="80" r="18" fill="#F5C85E" />
      <circle cx="108" cy="54" r="16" fill="#F47752" />
      <circle cx="138" cy="46" r="20" fill="#74BDB5" />
      <circle cx="168" cy="58" r="17" fill="#A89BDD" />
      <circle cx="182" cy="88" r="18" fill="#F5C85E" />
      <circle cx="170" cy="118" r="16" fill="#F47752" />
      <circle cx="144" cy="140" r="17" fill="#74BDB5" />
      <circle cx="130" cy="168" r="16" fill="#A89BDD" />
      
      <!-- Ponto inferior composto -->
      <circle cx="130" cy="220" r="18" fill="url(#gradDotCoral)" />
      <circle cx="126" cy="216" r="6" fill="#FFFFFF" opacity="0.5" />

      <!-- Pequenas estrelinhas decorativas ao redor -->
      <path d="M 60 50 L 63 56 L 70 57 L 64 62 L 66 69 L 60 65 L 54 69 L 56 62 L 50 57 L 57 56 Z" fill="#F5C85E" opacity="0.8" />
      <path d="M 195 140 L 197 144 L 202 145 L 198 148 L 199 153 L 195 150 L 191 153 L 192 148 L 188 145 L 193 144 Z" fill="#74BDB5" opacity="0.8" />
      <circle cx="95" cy="130" r="5" fill="#A89BDD" opacity="0.6" />
      <circle cx="170" cy="180" r="6" fill="#F5C85E" opacity="0.7" />
    </svg>
  
            </div>
          </div>

          <div class="card4-hints-container">
            <div class="card4-hints-label">
              PODE SER UM ANIMAL, UMA COMIDA OU UM BRINQUEDO.
            </div>
            <div class="card4-hints-grid">
              <div class="card4-hint-card">
                <div class="card4-hint-icon">
    <svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <!-- Pegadinha fofa de animal -->
      <ellipse cx="50" cy="62" rx="22" ry="18" fill="#F47752" />
      <circle cx="28" cy="38" r="8" fill="#F47752" />
      <circle cx="43" cy="28" r="8.5" fill="#F47752" />
      <circle cx="58" cy="28" r="8.5" fill="#F47752" />
      <circle cx="73" cy="38" r="8" fill="#F47752" />
    </svg>
  </div>
                <span>Animal</span>
              </div>
              <div class="card4-hint-card">
                <div class="card4-hint-icon">
    <svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <!-- Maçãzinha fofa -->
      <path d="M 50 40 C 40 26 22 26 22 46 C 22 72 45 84 50 84 C 55 84 78 72 78 46 C 78 26 60 26 50 40 Z" fill="#F5C85E" />
      <!-- Cabinho -->
      <path d="M 50 36 C 50 24 55 18 60 16" fill="none" stroke="#24334B" stroke-width="3.5" stroke-linecap="round" />
      <!-- Folhinha -->
      <path d="M 52 26 C 62 20 68 28 58 32 Z" fill="#74BDB5" />
    </svg>
  </div>
                <span>Comida</span>
              </div>
              <div class="card4-hint-card">
                <div class="card4-hint-icon">
    <svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <!-- Cubo lúdico com letra -->
      <rect x="22" y="24" width="56" height="56" rx="14" fill="#A89BDD" />
      <text x="50" y="63" font-family="'Fredoka', sans-serif" font-size="34" font-weight="700" fill="#FFF8F0" text-anchor="middle">P</text>
    </svg>
  </div>
                <span>Brinquedo</span>
              </div>
            </div>
          </div>

          <div class="footer-signature">
            <div class="dot"></div>
            <span>BRINCANDO COM OS SONS</span>
            <div class="dot"></div>
          </div>
        </div>
      </div>
    </body>
    </html>

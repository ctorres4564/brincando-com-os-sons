<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Card 03 — Descoberta do Som</title>
  <link rel="stylesheet" href="../src/styles/design-system.css">
  <style>
    .card-descoberta {
      background-color: var(--color-creme);
      text-align: center;
    }

    .header-descoberta {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    .badge-escuta {
      display: flex;
      align-items: center;
      gap: 16px;
      background-color: rgba(116, 189, 181, 0.18);
      padding: 12px 36px;
      border-radius: 50px;
      margin-bottom: 16px;
    }

    .badge-escuta svg {
      width: 48px;
      height: 48px;
    }

    .badge-escuta span {
      font-family: var(--font-title);
      font-size: 32px;
      font-weight: 700;
      color: #3B7C75;
      letter-spacing: 1px;
    }

    .title-descoberta {
      font-family: var(--font-title);
      font-size: 66px;
      font-weight: 700;
      color: var(--color-azul-escuro);
      margin-bottom: 24px;
      letter-spacing: 1px;
    }

    /* Lista vertical das 4 palavras com 'P' em destaque coral */
    .lista-palavras {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 680px;
      margin: 10px auto 26px auto;
      width: 100%;
    }

    .palavra-card {
      background-color: #FFFFFF;
      border-radius: 28px;
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(36, 51, 75, 0.04);
      border: 3px solid rgba(168, 155, 221, 0.25);
    }

    .palavra-texto {
      font-family: var(--font-title);
      font-size: 60px;
      font-weight: 700;
      letter-spacing: 6px;
      line-height: 1.1;
      display: flex;
      align-items: center;
    }

    .palavra-texto .letra-p {
      color: var(--color-coral);
      font-size: 72px;
      font-weight: 800;
      margin-right: 2px;
      text-shadow: 0 4px 10px rgba(244, 119, 82, 0.25);
    }

    .palavra-texto .resto-palavra {
      color: var(--color-azul-escuro);
    }

    .miniatura-ilustracao {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .miniatura-ilustracao svg {
      width: 100%;
      height: 100%;
    }

    /* Caixa da grande descoberta */
    .banner-descoberta {
      background: linear-gradient(135deg, #F47752 0%, #FF9B71 100%);
      border-radius: 36px;
      padding: 30px 40px;
      color: #FFFFFF;
      box-shadow: 0 16px 36px rgba(244, 119, 82, 0.25);
      max-width: 860px;
      margin: 0 auto;
    }

    .banner-descoberta h3 {
      font-family: var(--font-title);
      font-size: 50px;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .banner-descoberta p {
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card-container card-descoberta">
    <svg class="bg-decor" viewBox="0 0 1080 1350" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="150" cy="200" r="140" fill="#74BDB5" opacity="0.10" />
      <circle cx="920" cy="400" r="160" fill="#F5C85E" opacity="0.10" />
      <circle cx="120" cy="1150" r="150" fill="#A89BDD" opacity="0.08" />
    </svg>

    <div class="content">
      <div class="header-descoberta">
        <div class="badge-escuta">
          <!-- Ícone de escuta lúdico -->
          <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
            <rect x="25" y="48" width="24" height="64" rx="12" fill="#74BDB5" />
            <rect x="111" y="48" width="24" height="64" rx="12" fill="#74BDB5" />
            <path d="M 37 54 C 37 18 123 18 123 54" fill="none" stroke="#24334B" stroke-width="7" stroke-linecap="round" />
            <path d="M 143 65 C 151 74 151 86 143 95" fill="none" stroke="#F47752" stroke-width="5" stroke-linecap="round" />
            <path d="M 152 56 C 165 70 165 90 152 104" fill="none" stroke="#F5C85E" stroke-width="5" stroke-linecap="round" />
          </svg>
          <span>PERCEBA O SOM INICIAL</span>
        </div>
        <h2 class="title-descoberta">ESCUTE O COMEÇO!</h2>
      </div>

      <div class="lista-palavras">
        <!-- 1. PATO -->
        <div class="palavra-card">
          <div class="palavra-texto">
            <span class="letra-p">P</span><span class="resto-palavra">ATO</span>
          </div>
          <div class="miniatura-ilustracao">
            <svg viewBox="0 0 240 240">
              <path d="M 60 145 C 35 125 45 105 70 125 C 80 115 105 105 145 110 C 180 115 200 140 195 165 C 190 190 150 195 110 192 C 75 190 55 170 60 145 Z" fill="#F5C85E" />
              <circle cx="155" cy="85" r="38" fill="#F5C85E" />
              <path d="M 180 82 C 195 80 215 85 212 94 C 210 102 190 102 178 96 Z" fill="#F47752" />
              <circle cx="162" cy="78" r="6" fill="#24334B" />
            </svg>
          </div>
        </div>

        <!-- 2. PANELA -->
        <div class="palavra-card">
          <div class="palavra-texto">
            <span class="letra-p">P</span><span class="resto-palavra">ANELA</span>
          </div>
          <div class="miniatura-ilustracao">
            <svg viewBox="0 0 240 240">
              <path d="M 46 125 C 24 125 24 155 46 155" fill="none" stroke="#24334B" stroke-width="7" stroke-linecap="round" />
              <path d="M 194 125 C 216 125 216 155 194 155" fill="none" stroke="#24334B" stroke-width="7" stroke-linecap="round" />
              <rect x="44" y="110" width="152" height="78" rx="28" fill="#74BDB5" />
              <path d="M 48 108 C 55 82 185 82 192 108 Z" fill="#FFF8F0" stroke="#74BDB5" stroke-width="3" />
              <rect x="110" y="68" width="20" height="15" rx="6" fill="#F47752" />
            </svg>
          </div>
        </div>

        <!-- 3. PIPA -->
        <div class="palavra-card">
          <div class="palavra-texto">
            <span class="letra-p">P</span><span class="resto-palavra">IPA</span>
          </div>
          <div class="miniatura-ilustracao">
            <svg viewBox="0 0 240 240">
              <polygon points="120,35 60,105 120,105" fill="#F47752" />
              <polygon points="120,35 180,105 120,105" fill="#F5C85E" />
              <polygon points="60,105 120,168 120,105" fill="#74BDB5" />
              <polygon points="180,105 120,168 120,105" fill="#A89BDD" />
              <line x1="120" y1="35" x2="120" y2="168" stroke="#FFF8F0" stroke-width="4" stroke-linecap="round" />
            </svg>
          </div>
        </div>

        <!-- 4. PÃO -->
        <div class="palavra-card">
          <div class="palavra-texto">
            <span class="letra-p">P</span><span class="resto-palavra">ÃO</span>
          </div>
          <div class="miniatura-ilustracao">
            <svg viewBox="0 0 240 240">
              <ellipse cx="120" cy="182" rx="78" ry="16" fill="#24334B" opacity="0.12" />
              <path d="M 44 145 C 38 105 70 65 120 65 C 170 65 202 105 196 145 C 192 172 165 178 120 178 C 75 178 48 172 44 145 Z" fill="#EAA638" />
              <path d="M 112 88 C 124 78 132 105 122 120 C 112 130 102 105 112 88 Z" fill="#FFF6DE" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Banner de Descoberta -->
      <div class="banner-descoberta">
        <h3>TODAS COMEÇAM COM O SOM /P/!</h3>
        <p>Um som suave e divertido de explorar juntos na fala</p>
      </div>

      <div class="footer-signature">
        <div class="dot"></div>
        <span>BRINCANDO COM OS SONS</span>
        <div class="dot"></div>
      </div>
    </div>
  </div>
</body>
</html>

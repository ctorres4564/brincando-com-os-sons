<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Card 05 — Encerramento e CTA</title>
  <link rel="stylesheet" href="../src/styles/design-system.css">
  <style>
    .card-encerramento {
      background-color: var(--color-creme);
      text-align: center;
    }

    .header-encerramento {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    .manifesto-box {
      background-color: rgba(116, 189, 181, 0.16);
      border-radius: 32px;
      padding: 24px 36px;
      max-width: 860px;
      border: 2px dashed rgba(116, 189, 181, 0.4);
      margin-bottom: 24px;
    }

    .title-manifesto {
      font-family: var(--font-title);
      font-size: 42px;
      font-weight: 700;
      color: var(--color-azul-escuro);
      line-height: 1.3;
      letter-spacing: 0.5px;
    }

    .ilustracao-comunicacao {
      width: 220px;
      height: 150px;
      margin: 10px auto;
      filter: drop-shadow(0 8px 20px rgba(36, 51, 75, 0.06));
    }

    /* Bloco central da Pergunta e CTA */
    .cta-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
    }

    .pergunta-cta {
      font-family: var(--font-title);
      font-size: 52px;
      font-weight: 700;
      color: var(--color-azul-escuro);
      line-height: 1.25;
      background-color: #FFFFFF;
      padding: 30px 40px;
      border-radius: 36px;
      box-shadow: 0 10px 28px rgba(36, 51, 75, 0.04);
      border: 3px solid rgba(245, 200, 94, 0.4);
      width: 100%;
    }

    .pergunta-cta .highlight {
      color: var(--color-coral);
    }

    .btn-comentarios {
      background: linear-gradient(135deg, #F47752 0%, #FF9B71 100%);
      color: #FFFFFF;
      border-radius: 50px;
      padding: 24px 56px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      box-shadow: 0 14px 32px rgba(244, 119, 82, 0.28);
      width: 100%;
    }

    .btn-comentarios span {
      font-family: var(--font-title);
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .btn-comentarios svg {
      width: 44px;
      height: 44px;
    }

    .salvar-box {
      background-color: #FFFFFF;
      border-radius: 50px;
      padding: 16px 44px;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      border: 2px solid rgba(168, 155, 221, 0.4);
      box-shadow: 0 6px 18px rgba(36, 51, 75, 0.03);
    }

    .salvar-box span {
      font-family: var(--font-body);
      font-size: 30px;
      font-weight: 800;
      color: #6C5CA7;
    }

    .salvar-box svg {
      width: 32px;
      height: 32px;
      color: #6C5CA7;
    }
  </style>
</head>
<body>
  <div class="card-container card-encerramento">
    <svg class="bg-decor" viewBox="0 0 1080 1350" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="140" cy="180" r="150" fill="#74BDB5" opacity="0.12" />
      <circle cx="940" cy="300" r="140" fill="#F5C85E" opacity="0.10" />
      <circle cx="980" cy="1150" r="170" fill="#A89BDD" opacity="0.10" />
    </svg>

    <div class="content">
      <div class="header-encerramento">
        <div class="manifesto-box">
          <h2 class="title-manifesto">
            BRINCAR COM OS SONS É CRIAR OPORTUNIDADES DE COMUNICAÇÃO!
          </h2>
        </div>

        <!-- Ilustração de balões e conexão -->
        <div class="ilustracao-comunicacao">
          <svg viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M 50 40 C 50 20 170 20 170 50 C 170 80 120 85 90 85 L 65 100 L 72 85 C 55 85 50 65 50 40 Z" fill="#A89BDD" opacity="0.85" />
            <path d="M 110 80 C 110 55 240 55 240 90 C 240 120 195 125 170 125 L 155 145 L 158 125 C 120 125 110 105 110 80 Z" fill="#F47752" />
            <circle cx="150" cy="90" r="5" fill="#FFF8F0" />
            <circle cx="175" cy="90" r="5" fill="#FFF8F0" />
            <circle cx="200" cy="90" r="5" fill="#FFF8F0" />
            <path d="M 235 38 C 235 32 242 28 248 33 C 254 28 261 32 261 38 C 261 48 248 54 248 54 C 248 54 235 48 235 38 Z" fill="#F5C85E" />
          </svg>
        </div>
      </div>

      <div class="cta-container">
        <div class="pergunta-cta">
          QUAL PALAVRA COM <span class="highlight">/P/</span> VOCÊ LEMBROU?
        </div>

        <div class="btn-comentarios">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>CONTE NOS COMENTÁRIOS!</span>
        </div>

        <div class="salvar-box">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>SALVE PARA BRINCAR DEPOIS.</span>
        </div>
      </div>

      <div class="footer-signature">
        <div class="dot"></div>
        <span>BRINCANDO COM OS SONS</span>
        <div class="dot"></div>
      </div>
    </div>
  </div>
</body>
</html>
